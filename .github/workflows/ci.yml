name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Force bash on every runner — Windows defaults to pwsh which splits
# `./...` differently and turns it into a "FAIL .out [setup failed]"
# Go-package error. Git Bash is preinstalled on windows-latest.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------
  # Static checks: gofmt, vet, go mod tidy, govulncheck.
  # Fast (~30s), runs on every push.
  # ------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt drift in:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum out of sync; run 'go mod tidy'"
            exit 1
          fi

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ------------------------------------------------------------------------
  # Tier 1 — unit tests with race detector + coverage. Cross-platform matrix.
  # ------------------------------------------------------------------------
  unit-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: build
        run: go build ./...

      # gotestsum wraps `go test` and emits JUnit XML alongside the
      # standard Go output. Codecov's test-results-action ingests that
      # JUnit file for Test Analytics (flaky-test detection, per-test
      # duration trends) — a separate product from coverage.
      - name: install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: test (race + coverage + junit)
        run: |
          gotestsum \
            --junitfile junit.xml \
            --junitfile-project-name=activesync-mcp \
            --junitfile-testsuite-name=short \
            --junitfile-testcase-classname=short \
            -- -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      # Surface the JUnit XML as an artifact so we can debug Codecov
      # parser behavior without re-running CI. One artifact per OS so
      # matrix legs don't clobber each other.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.os }}
          path: junit.xml
          if-no-files-found: error

      - name: coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -5

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

      # Upload to Codecov from the Linux leg only — uploading from
      # all three OSes would just merge identical-from-Linux content.
      # CODECOV_TOKEN is set as a repo secret; failures stay non-fatal
      # so a codecov.io outage doesn't break the build.
      - uses: codecov/codecov-action@v6
        if: matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

      # Test Analytics: upload junit.xml from every matrix OS so per-OS
      # flakiness is visible. Use `if: !cancelled()` so the upload still
      # happens when tests fail (the whole point of flake tracking).
      # `codecov/test-results-action@v1` is the supported action per
      # https://docs.codecov.com/docs/test-analytics. (The docs page
      # shows @v5 in its YAML snippet; that tag isn't actually
      # published — only v1.x exists. Pinning to @v1 picks up the
      # latest 1.x and is what go-activesync settled on after the same
      # 404 bounce.) The unified codecov-action does not file uploads
      # correctly into the Tests page — it routes them through
      # upload-coverage no matter how `report_type` is set, which
      # silently drops the JUnit data.
      # Two flags: one aggregates across OSes ("unittests"), one slices
      # by platform (the matrix os name, e.g. "ubuntu-latest"). Codecov
      # tracks per-test data per (test name × flag) tuple, so a flake
      # that only manifests on Windows shows up under both unittests
      # and windows-latest while staying invisible on macos-latest.
      - uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          flags: unittests,${{ matrix.os }}
          fail_ci_if_error: false

  # ------------------------------------------------------------------------
  # Tier 2 — integration tests against real OS surfaces (keyring, bbolt,
  # signals, CLI subcommands). Cross-platform.
  #
  # Linux runs against gnome-keyring here; the kwallet leg lives in
  # `integration-kwallet` below because Ubuntu noble (the runner image)
  # doesn't ship a kwalletd binary, so that leg runs inside an Arch
  # container instead.
  # ------------------------------------------------------------------------
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ss-provider: keychain
          - os: windows-latest
            ss-provider: wincred
          - os: ubuntu-latest
            ss-provider: gnome-keyring
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: install + start gnome-keyring
        if: matrix.os == 'ubuntu-latest' && matrix.ss-provider == 'gnome-keyring'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring libsecret-1-0 dbus-x11
          eval $(dbus-launch --sh-syntax)
          echo -n "" | gnome-keyring-daemon --unlock
          gnome-keyring-daemon --start --components=secrets
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV

      - name: install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: integration tests
        run: |
          gotestsum \
            --junitfile junit-integration.xml \
            --junitfile-project-name=activesync-mcp \
            --junitfile-testsuite-name=short \
            --junitfile-testcase-classname=short \
            -- -tags integration -count=1 -timeout 5m ./...

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-integration-${{ matrix.os }}
          path: junit-integration.xml
          if-no-files-found: error

      # Per-platform flag in addition to "integration" — see unittests
      # comment above for why.
      - uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit-integration.xml
          flags: integration,${{ matrix.os }}
          fail_ci_if_error: false

  # ------------------------------------------------------------------------
  # Tier 2 (kwallet) — same integration suite, but with kwalletd6 as the
  # D-Bus Secret Service provider instead of gnome-keyring.
  #
  # gnome-keyring and kwalletd6 implement the same Secret Service spec but
  # differ in collection/attribute handling and prompt-on-locked behavior;
  # both are common in the wild on Linux desktops, so we run the keyring
  # leg of the suite under each.
  #
  # Runs in an `archlinux:latest` container because Ubuntu noble (the host
  # runner) dropped both kwalletd5 and kwalletd6 from its repos after the
  # KF6 reorg. Arch ships `kwalletd6` as part of the `kwallet` package.
  # ------------------------------------------------------------------------
  integration-kwallet:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: install system deps
        run: |
          # Refresh the package index and install:
          # - kwallet: provides ksecretd (the actual Secret Service
          #   implementation in KF6) and kwalletd6 (legacy KWallet
          #   wrapper, unused here)
          # - dbus, libsecret: SS bus + client library (secret-tool)
          # - xorg-server-xvfb, openbox, xdotool: ksecretd is a Qt
          #   GUI app that pops a wallet-creation wizard the first
          #   time anyone calls CreateCollection; we run a tiny X
          #   server + window manager so xdotool can drive the
          #   wizard headlessly
          # - nettle: Xvfb runtime dep that's missing on bare arch
          # - git: for actions/checkout + Go's VCS stamp
          # - go, base-devel, ca-certificates: build/test toolchain
          pacman -Sy --noconfirm --needed \
            kwallet dbus libsecret \
            xorg-server-xvfb openbox xdotool nettle imagemagick \
            git go base-devel ca-certificates

      - uses: actions/checkout@v6

      - name: mark workspace safe for git
        # The container runs as root but actions/checkout writes the
        # workspace as the runner uid; without this, `go build`
        # subprocesses spawned by the integration tests fail with
        # "error obtaining VCS status: exit status 128" because Go
        # asks git for the build stamp and git refuses to read a
        # repo with mismatched ownership.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: bootstrap ksecretd default wallet
        # Architecture note (KF6): ksecretd is the actual Secret
        # Service implementation — it owns the storage and registers
        # org.freedesktop.secrets on the bus. kwalletd6 became a
        # legacy-API shim on top of ksecretd; we don't need it.
        #
        # The catch is that ksecretd has no headless mode: the first
        # call into CreateCollection always pops a Qt wallet-creation
        # wizard. Defaults are GPG encryption (which fails — no GPG
        # keys in CI) so we have to switch to "Classic, blowfish
        # encrypted file" which allows an empty password. Three
        # dialog pages: encryption-type wizard, password entry,
        # low-strength confirmation. xdotool drives all three by
        # mouse-clicking known coordinates from the rendered Qt
        # widgets (stable because the dialog geometry doesn't depend
        # on screen size or theme — only on Qt's default style).
        #
        # ksecretd auto-aliases the first collection it creates to
        # `default`, so once the wizard completes there's nothing
        # else to wire — go-keyring's keyring.Set/Get/Delete just
        # work.
        run: |
          # ksecretd needs /etc/machine-id for D-Bus.
          dbus-uuidgen --ensure
          ln -sf /var/lib/dbus/machine-id /etc/machine-id

          # Tiny X server + tiny window manager so the wizard's
          # windows get focusable bounds (Qt won't render usable
          # geometry under QT_QPA_PLATFORM=offscreen, and no-WM
          # X breaks xdotool windowactivate).
          Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          openbox >/tmp/openbox.log 2>&1 &
          sleep 1

          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

          ksecretd >/tmp/ksecretd.log 2>&1 &
          KSPID=$!
          for i in $(seq 1 20); do
            if dbus-send --session --print-reply --dest=org.freedesktop.DBus \
                /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner \
                string:org.freedesktop.secrets 2>/dev/null \
                | grep -q "boolean true"; then
              echo "ksecretd registered on org.freedesktop.secrets"
              break
            fi
            if ! kill -0 "$KSPID" 2>/dev/null; then
              echo "::error::ksecretd exited"; cat /tmp/ksecretd.log; exit 1
            fi
            sleep 0.5
          done

          mkdir -p /tmp/screenshots

          # Trigger wallet creation by storing a probe secret.
          # secret-tool blocks until the wizard is dismissed; we
          # background it under timeout(1) so the bootstrap step
          # can never wait forever on a stuck dialog.
          (
            timeout 60 secret-tool store --label=bootstrap-probe svc bootstrap <<<probe \
              >/tmp/secrettool.log 2>&1
            echo "secret-tool exit=$?" >>/tmp/secrettool.log
          ) &
          ST=$!

          # Wait for the wizard window to appear.
          for i in $(seq 1 30); do
            WIN=$(xdotool search --classname "ksecretd" 2>/dev/null | head -1 || true)
            [ -n "$WIN" ] && break
            sleep 0.3
          done
          if [ -z "$WIN" ]; then
            echo "::error::wallet wizard never appeared"
            cat /tmp/ksecretd.log
            import -window root /tmp/screenshots/01-no-window.png || true
            exit 1
          fi
          import -window root /tmp/screenshots/01-wizard-page1.png || true

          # Page 1: encryption-type wizard.
          # Click "Classic, blowfish encrypted file" radio (≈380,306).
          xdotool windowactivate "$WIN"
          sleep 0.3
          xdotool mousemove 380 306 click 1
          sleep 0.5
          import -window root /tmp/screenshots/02-after-radio.png || true
          # Click Finish (≈614, 501). With Blowfish chosen, the wizard
          # collapses to a single Finish button.
          xdotool mousemove 614 501 click 1
          sleep 1.5
          import -window root /tmp/screenshots/03-after-finish.png || true
          # Page 2: password dialog. Both fields default to empty;
          # Blowfish allows that. Click OK (≈511, 440).
          xdotool mousemove 511 440 click 1
          sleep 1
          import -window root /tmp/screenshots/04-after-ok.png || true
          # Page 3: low-strength confirmation. Click Yes (≈614, 378).
          xdotool mousemove 614 378 click 1
          sleep 2
          import -window root /tmp/screenshots/05-after-yes.png || true

          # Wait for secret-tool to complete (capped at 60s by
          # the inner `timeout 60` above).
          wait "$ST" || true
          import -window root /tmp/screenshots/06-final.png || true

          echo "--- secret-tool log ---"
          cat /tmp/secrettool.log
          echo "--- wallet files ---"
          ls -la /root/.local/share/kwalletd/ || true
          echo "--- collections ---"
          dbus-send --session --print-reply --dest=org.freedesktop.secrets \
            /org/freedesktop/secrets \
            org.freedesktop.DBus.Properties.Get \
            string:org.freedesktop.Secret.Service string:Collections | tail -8
          echo "--- ReadAlias(default) ---"
          dbus-send --session --print-reply --dest=org.freedesktop.secrets \
            /org/freedesktop/secrets \
            org.freedesktop.Secret.Service.ReadAlias string:default | tail -3

          # Sanity: a roundtrip secret-tool call must now work
          # without any UI (wallet exists + unlocked). If THIS
          # times out, the wizard automation didn't actually
          # create the wallet — the screenshots will show why.
          if ! timeout 15 secret-tool store --label=sanity svc sanity <<<sanity-value; then
            echo "::error::sanity store timed out — wallet creation failed"
            exit 1
          fi
          got=$(timeout 15 secret-tool lookup svc sanity)
          if [ "$got" != "sanity-value" ]; then
            echo "::error::sanity roundtrip failed: got=$got"
            exit 1
          fi
          secret-tool clear svc sanity
          echo "sanity roundtrip ok"
        timeout-minutes: 3

      - name: upload kwallet bootstrap screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: kwallet-bootstrap-screenshots
          path: /tmp/screenshots/
          if-no-files-found: warn

      - name: install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: integration tests
        run: |
          # The Arch container puts go-installed binaries in
          # ~/go/bin which isn't on PATH by default in non-login
          # shells.
          export PATH="$HOME/go/bin:$PATH"
          gotestsum \
            --junitfile junit-integration.xml \
            --junitfile-project-name=activesync-mcp \
            --junitfile-testsuite-name=short \
            --junitfile-testcase-classname=short \
            -- -tags integration -count=1 -timeout 5m ./...

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-integration-kwallet
          path: junit-integration.xml
          if-no-files-found: error

      # Codecov flag matches the gnome-keyring leg's pattern:
      # "integration" aggregates across legs, the leg-specific flag
      # ("kwallet") slices for per-provider flake tracking. We use
      # "kwallet" rather than "ubuntu-latest" because the gnome-keyring
      # leg already owns that OS slot on the Tests page.
      - uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit-integration.xml
          flags: integration,kwallet
          fail_ci_if_error: false

  # ------------------------------------------------------------------------
  # Tier 3 — end-to-end tests against the go-activesync testenv (Z-Push
  # + Dovecot + Postfix + Radicale Docker stack). Linux only (docker).
  # ------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      # GitHub Actions disallows checkout outside the workspace; CI
      # checks out the testenv-providing sibling repo at
      # $GITHUB_WORKSPACE/go-activesync and brings up the docker stack
      # below directly. Local devs use `make e2e` which expects the
      # sibling at ../go-activesync (override with GO_ACTIVESYNC_DIR).
      - uses: actions/checkout@v6
        with:
          repository: hstern/go-activesync
          path: go-activesync

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: bring up testenv
        working-directory: go-activesync/testenv
        run: |
          docker compose up --build -d
          for i in $(seq 1 90); do
            status=$(docker inspect -f '{{.State.Health.Status}}' go-activesync-zpush 2>/dev/null || echo missing)
            echo "[$i] healthcheck=$status"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 2
          done
          if [ "$status" != "healthy" ]; then
            docker compose logs
            exit 1
          fi

      - name: install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: e2e tests
        run: |
          gotestsum \
            --junitfile junit-e2e.xml \
            --junitfile-project-name=activesync-mcp \
            --junitfile-testsuite-name=short \
            --junitfile-testcase-classname=short \
            -- -tags e2e -count=1 -timeout 10m ./...

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-e2e
          path: junit-e2e.xml
          if-no-files-found: error

      - uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit-e2e.xml
          flags: e2e
          fail_ci_if_error: false

      - name: container logs on failure
        if: failure()
        working-directory: go-activesync/testenv
        run: docker compose logs

      - name: tear down
        if: always()
        working-directory: go-activesync/testenv
        run: docker compose down -v

  # ------------------------------------------------------------------------
  # Tier 4 — scenario tests. Multi-call agent-shaped flows. Same testenv
  # as Tier 3.
  # ------------------------------------------------------------------------
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: hstern/go-activesync
          path: go-activesync

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: bring up testenv
        working-directory: go-activesync/testenv
        run: |
          docker compose up --build -d
          for i in $(seq 1 90); do
            status=$(docker inspect -f '{{.State.Health.Status}}' go-activesync-zpush 2>/dev/null || echo missing)
            if [ "$status" = "healthy" ]; then break; fi
            sleep 2
          done

      - name: install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: scenario tests
        run: |
          gotestsum \
            --junitfile junit-scenario.xml \
            --junitfile-project-name=activesync-mcp \
            --junitfile-testsuite-name=short \
            --junitfile-testcase-classname=short \
            -- -tags scenario -count=1 -timeout 10m ./...

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-scenario
          path: junit-scenario.xml
          if-no-files-found: error

      - uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit-scenario.xml
          flags: scenario
          fail_ci_if_error: false

      - name: container logs on failure
        if: failure()
        working-directory: go-activesync/testenv
        run: docker compose logs

      - name: tear down
        if: always()
        working-directory: go-activesync/testenv
        run: docker compose down -v
